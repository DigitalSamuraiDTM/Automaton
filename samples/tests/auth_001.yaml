compilationUnit:
  context:
    elements:
      - element:
          elementName: loginButton
          elementLayout: https://youtube.com
      - element:
          elementName: loginScreen
          elementLayout: https://youtube.com
      - element:
          elementName: loginField
          elementLayout: https://youtube.com
      - element:
          elementName: passwordField
          elementLayout: https://youtube.com
      - element:
          elementName: submitButton
          elementLayout: https://youtube.com
      - element:
          elementName: homeTitle
          elementLayout: https://youtube.com
    theme:
      themeMode: light
    permissions:
      - camera: true
      - microphone: true
  test:
    metadata:
      id: "AUTH_001"
      name: "Successful authorization"
    steps:
      - step:
          stepDescription: "Открываем экран авторизации"
          actions:
            - tap:
                elementName: loginButton
                tapType: single
            - wait:
                condition:
                  elementName: loginScreen
                  elementProperty: visible
                  propertyValue: true
                timeout: 1m
      - step:
          stepDescription: "Вводим учетные данные"
          actions:
            - input:
                elementName: loginField
                inputData: "admin"
            - input:
                elementName: passwordField
                inputData: "password"
      - step:
          stepDescription: "Авторизуемся и попадаем на главный экран"
          actions:
            - tap:
                elementName: submitButton
                tapType: single

            - wait:
                condition:
                  elementName: homeTitle
                  elementProperty: visible
                  propertyValue: true
                timeout: 5s

            - assert:
                condition:
                  elementName: homeTitle
                  elementProperty: visible
                  propertyValue: true