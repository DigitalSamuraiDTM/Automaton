compilationUnit:
  context:
    theme:
      themeMode: light
    permissions:
      - camera: true
      - microphone: true
  test:
    metadata:
      id: "AUTH_001"
      name: "Successful authorization"
    steps:
      - step:
          actions:
            - tap:
                elementName: loginButton
                tapType: single
            - wait:
                condition:
                  elementName: loginScreen
                  elementProperty: visible
                  propertyValue: true
                timeout: 1m
      - step:
          actions:
            - input:
                elementName: loginField
                inputData: "admin"
            - input:
                elementName: passwordField
                inputData: "password"
      - step:
        - actions:
            - tap:
                elementName: submitButton
                tapType: single

            - wait:
                condition:
                  elementName: homeTitle
                  elementProperty: visible
                  propertyValue: true
                timeout: 5s

            - assert:
                condition:
                  elementName: homeTitle
                  elementProperty: visible
                  propertyValue: true