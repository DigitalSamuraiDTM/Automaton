compilationUnit:
  #context: {}   # Пока не описан
  test:
    metadata:
      id: "AUTH_001"
      name: "Successful authorization"
    steps:
      - step:
          actions:
            - tap:
                element: loginButton
                tapType: single
      - step:
          actions:
            - input:
                element: loginField
                inputData: "admin"
            - input:
                element: passwordField
                inputData: "password"
      - step:
        - actions:
            - tap:
                element: submitButton
                tapType: single

            - wait:
                condition:
                  element: homeTitle
                  elementProperty: visible
                  propertyValue: true
                timeout: 5s

            - assert:
                condition:
                  element: homeTitle
                  elementProperty: visible
                  propertyValue: true